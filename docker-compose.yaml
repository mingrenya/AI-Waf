services:
  # MongoDB 服务
  mongodb:
    image: mongo:6.0
    container_name: waf-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-waf_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb # 添加配置数据卷
    ports:
      - "27017:27017"
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 可选：添加命令行参数
    command: --wiredTigerCacheSizeGB 1.5

  # Redis — 实时数据层
  redis:
    image: redis:7-alpine
    container_name: waf-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MRYa WAF 服务（统一使用小写命名）
  mrya:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: mrya-waf
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # ── 运行模式 ──
      IS_PRODUCTION: ${IS_PRODUCTION:-false}
      IS_K8S: "true"                     # 容器环境标识
      # ── 数据库 ──
      DB_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-example}@mongodb:27017
      DB_NAME: ${DB_NAME:-waf}
      # ── JWT ──
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HRS: ${JWT_EXPIRATION_HRS:-12}
      # ── 前端 ──
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      # ── 跨域 ──
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # ── Redis ──
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ── 日志 ──
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_FILE: ${LOG_FILE:-/dev/stdout}
      # ── AI ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # ── 数据目录（容器内路径） ──
      NUCLEI_TEMPLATES_PATH: ${NUCLEI_TEMPLATES_PATH:-/app/nuclei-templates}
      CAPTURE_DATA_PATH: ${CAPTURE_DATA_PATH:-/app/data/captures}
      BACKUP_DATA_PATH: ${BACKUP_DATA_PATH:-/app/data/backups}
      FTW_TESTS_PATH: ${FTW_TESTS_PATH:-/app/ftw-tests}
      # ── K8s/容器路径覆盖（IS_K8S=true 时使用） ──
      GEOIP_BASE_PATH: ${GEOIP_BASE_PATH:-/opt/geoip}
      HAPROXY_BASE_PATH: ${HAPROXY_BASE_PATH:-/app/waf}
      # ── 日志系统 ──
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      # ── WAF 高级防护 ──
      SENSITIVE_DATA_FILTER: ${SENSITIVE_DATA_FILTER:-false}
      SCAN_PROTECTION: ${SCAN_PROTECTION:-false}
      BOT_PROTECTION: ${BOT_PROTECTION:-false}
      ANTI_EVASION: ${ANTI_EVASION:-false}
      FORENSICS_CAPTURE: ${FORENSICS_CAPTURE:-false}
    ports:
      - "0.0.0.0:2333:2333"
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:9443:9443"
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
      - "0.0.0.0:8404:8404"
    volumes:
      - mrya_data:/app/data
      - captures_data:/app/data/captures
      - backups_data:/app/data/backups
      - ./geo-ip:/opt/geoip:ro
      - ./server/public/ftw-tests:/app/ftw-tests:ro
      - ./nuclei-templates:/app/nuclei-templates:ro
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MCP Server 服务 - 基于官方go-sdk的标准实现
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: ai-waf-mcp-server
    restart: always
    depends_on:
      mrya:
        condition: service_healthy
    env_file:
      - .env  # 加载环境变量配置文件
    environment:
      # MCP Server通过HTTP调用后端API
      # 使用 Docker 内部网络，通过服务名访问
      WAF_BACKEND_URL: http://mrya:2333
      WAF_USERNAME: ${WAF_USERNAME:-admin}
      WAF_PASSWORD: ${WAF_PASSWORD}
    # MCP Server 通过 STDIO 通信,不需要暴露端口
    # stdin_open和tty用于支持stdio传输
    stdin_open: true
    tty: true
    networks:
      - waf-network
    # 日志输出
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # 日志系统：Loki (日志聚合) + Grafana (可视化)
  # ========================================

  # Loki - 轻量级日志聚合系统，兼容 Prometheus 生态
  loki:
    image: grafana/loki:3.5.0
    container_name: waf-loki
    restart: always
    user: "10001:10001"
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - loki_wal:/wal
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # Promtail - 日志采集器，从 Docker 日志文件和 journald 采集日志发送到 Loki
  promtail:
    image: grafana/promtail:3.5.0
    container_name: waf-promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - waf-network
    depends_on:
      loki:
        condition: service_healthy


  # Grafana - 可视化仪表盘
  grafana:
    image: grafana/grafana:11.6.0
    container_name: waf-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - waf-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# 定义持久化卷
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mrya_data:
    driver: local
  loki_data:
    driver: local
  loki_wal:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  captures_data:
    driver: local
  backups_data:
    driver: local

# 定义 Loki 配置文件
configs:
  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 744h         # 保留 31 天
        max_entries_limit_per_query: 5000
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem

# 定义网络
networks:
  waf-network:
    driver: bridge
