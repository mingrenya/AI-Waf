services:
  # MongoDB 服务
  mongodb:
    image: mongo:6.0
    container_name: waf-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-waf_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb # 添加配置数据卷
    ports:
      - "27017:27017"
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 可选：添加命令行参数
    command: --wiredTigerCacheSizeGB 1.5

  # MRYa WAF 服务（统一使用小写命名）
  mrya:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrya-waf
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-example}@mongodb:27017
      JWT_SECRET: ${JWT_SECRET}
      IS_PRODUCTION: ${IS_PRODUCTION:-false}
      IS_K8S: "true"  # 容器环境标识，使用容器内路径
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      # DeepSeek AI助手配置
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    ports:
      - "0.0.0.0:2333:2333"
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:9443:9443"
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
      - "0.0.0.0:8404:8404"
    volumes:
      - mrya_data:/app/data
      - ./geo-ip:/home/mrya/mrya-waf/geo-ip:ro
    networks:
      - waf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MCP Server 服务 - 基于官方go-sdk的标准实现
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: ai-waf-mcp-server
    restart: always
    depends_on:
      mrya:
        condition: service_healthy
    env_file:
      - .env  # 加载环境变量配置文件
    environment:
      # MCP Server通过HTTP调用后端API
      # 使用 Docker 内部网络，通过服务名访问
      WAF_BACKEND_URL: http://mrya:2333
      WAF_USERNAME: ${WAF_USERNAME:-admin}
      WAF_PASSWORD: ${WAF_PASSWORD}
    # MCP Server 通过 STDIO 通信,不需要暴露端口
    # stdin_open和tty用于支持stdio传输
    stdin_open: true
    tty: true
    networks:
      - waf-network
    # 日志输出
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 定义持久化卷
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mrya_data:
    driver: local

# 定义网络
networks:
  waf-network:
    driver: bridge
